spring.application.name=medinova

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/medinova
spring.datasource.username=medinova_user
spring.datasource.password=medinova_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# JWT Configuration
jwt.secret=your-256-bit-secret-key-for-jwt-token-generation-minimum-32-characters-long-secure-key
jwt.expiration=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.project.medinova.controller

# VNPAY Configuration
# Lấy từ VNPAY Sandbox Portal sau khi đăng ký
vnpay.tmn.code=YOUR_TMN_CODE
vnpay.hash.secret=YOUR_HASH_SECRET
vnpay.payment.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return.url=http://localhost:3000/payment/success
vnpay.api.url=https://sandbox.vnpayment.vn/merchant_webapi/merchant.html

# Email Configuration
# Cấu hình SMTP để gửi email thông báo lịch khám
# Ví dụ với Gmail:
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=medinova@example.com

# Email Service Configuration
app.email.enabled=true